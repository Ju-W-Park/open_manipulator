/**:
  ros__parameters:
    joint_names:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - rh_r1_joint

    step_names: [home]  # Names of the steps

    # Home pose for custom_inverted_omy_l100 (shortened links, ceiling-mounted)
    # -- explicit target angles (2026-08-05): joint1=0, joint2=90, joint3=90,
    # joint4=0, joint5=-90, joint6=0 deg, gripper=-6.33 deg. Shared across
    # units 1/2/3, which are all custom_inverted. This is a designated target,
    # not a live sensor reading -- driven to via joint_trajectory_executor
    # (init_position:=true) and confirmed on arrival.
    home: [0.0, 1.5707963267948966, 1.5707963267948966, 0.0, -1.5707963267948966, 0.0, -0.11047934165124106]  # Initial position

    duration: 20.0
    epsilon: 0.01
    action_topic: '/arm_controller/follow_joint_trajectory'
    joint_states_topic: '/joint_states'
